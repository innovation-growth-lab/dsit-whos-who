[build-system]
requires = [ "setuptools",]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.9"
name = "dsit_whos_who"
readme = "README.md"
dynamic = [ "version",]
dependencies = [
    "ipython>=8.10",
    "jupyterlab>=3.0", 
    "kedro~=0.19.11",
    "kedro-datasets~=6.0.0",
    "notebook",
    "pyarrow~=19.0.1",
    "pandas~=2.2.3", 
    "numpy~=2.2.3",
    "joblib~=1.4.2",
    "requests~=2.32.3",
    "s3fs~=2025.3.0",
    "openpyxl~=3.1.5",
    "textdistance~=4.6.3",
    "rapidfuzz~=3.12.2",
    "scipy~=1.15.2",
    "tqdm~=4.67.1",
    "mlflow~=2.21.0",
    "kedro-mlflow~=0.14.4",
    "scikit-learn~=1.6.1",
    "imbalanced-learn~=0.13.0",
    "xgboost~=2.1.4",
    "sentence-transformers~=4.0.1",
    "pytest~=8.3.5",
    "streamlit~=1.45.0"
]

[project.scripts]
dsit-whos-who = "dsit_whos_who.__main__:main"

[tool.kedro]
package_name = "dsit_whos_who"
project_name = "dsit-whos-who"
kedro_init_version = "0.19.10"
tools = "['Custom Logging']"
example_pipeline = "False"
source_dir = "src"

[project.entry-points."kedro.hooks"]

[tool.setuptools.dynamic.version]
attr = "dsit_whos_who.__version__"

[tool.setuptools.packages.find]
where = [ "src",]
namespaces = false
